# ══════════════════════════════════════════════════════════════
#  成品参数存档模板
#  复制这个文件，改名为  YYYY-MM-DD-简短描述.yaml  再填。
#  下面括号里的内容是示例，填的时候删掉。
# ══════════════════════════════════════════════════════════════

# ── 基本信息 ──────────────────────────────────────────────────
photo: IMG_0000.CR3
camera: Canon EOS R8 + RF 50mm F1.8 STM
iso: 1600
shot_at: 2026-01-01 18:20
location: <地点，可留空>

# ── 意图：这一节最重要，脚本生成不了 ──────────────────────────
# 三个月后你会忘记当时在想什么。写下来。
intent: |
  <想让这张照片表达什么？为什么选这个方向？>
  <当时的取舍是什么？放弃了什么、换来了什么？>

# ── 曝光优先：p50 是第一个要看的数字 ──────────────────────────
exposure_first:
  p50_before: 172      # 调之前，一半画面比这个值亮
  p50_after: 138       # 落在 110~160 才谈风格
  note: <如果原本过曝，记一笔——这决定了后面的所有操作>

# ── Camera Raw 参数 ───────────────────────────────────────────
# 色温一定要写死数值，不要写 "As Shot"（见坑 10）
settings:
  WhiteBalance: Custom
  Temperature: 3400
  Tint: 12
  Exposure2012: 0.55
  Contrast2012: 16
  Highlights2012: -10
  Shadows2012: 28
  Whites2012: 22
  Blacks2012: -10
  Vibrance: 15
  PostCropVignetteAmount: -14
  PostCropVignetteFeather: 70
  LuminanceSmoothing: 52      # 高 ISO 记得一起设，见坑 18
  LuminanceNoiseReductionDetail: 32
  ColorNoiseReduction: 34
  GrainAmount: 0

# ── 色调曲线：风格的核心 ──────────────────────────────────────
# 格式是扁平的 [输入,输出, 输入,输出, ...]，取值 0~255
curve:
  main: [0, 0, 48, 46, 128, 138, 200, 214, 255, 252]
  blue: [0, 12, 64, 72, 128, 130, 192, 188, 255, 255]   # 暗部抬+高光压 = 冷
  red:  [0, 0, 64, 62, 128, 126, 192, 190, 255, 255]    # 暗部压+高光抬 = 暖
  green: []                                             # 没用上就留空

# ── HSL / 颜色分级 ────────────────────────────────────────────
hsl:
  SaturationAdjustmentBlue: 0
  HueAdjustmentAqua: 0
  LuminanceAdjustmentOrange: 0

# ── 裁切（照片专属，不会存进预设）────────────────────────────
crop:
  angle: 1.33
  top: 0.090923
  left: 0.049346
  bottom: 0.792198
  right: 0.950654
  aspect: "2.08:1"

# ── 局部调整 ──────────────────────────────────────────────────
# 只记录用 add_local_adjustment 建的（add_ai_mask 禁用，见坑 9）
local_adjustments:
  - name: <蒙版名>
    type: radial          # radial | linear
    center: [0.443, 0.415]
    radius: [0.17, 0.22]
    feather: 80
    sliders:
      exposure: 0.4
      saturation: 12
      shadows: 15
      contrast: 10

# ── 诊断数据：调完之后的客观指标 ──────────────────────────────
diagnostics:
  p50: 138
  clipped_white_pct: 2.1    # 死白 ≥250 的占比，健康值 < 8%
  clipped_black_pct: 4.3    # 死黑 ≤12 的占比，健康值 1~8%
  region_rb: 14             # 目标区 R−B，负=冷 正=暖

# ── 验收 ──────────────────────────────────────────────────────
verified:
  reference: <参照渲染文件的路径>    # 唯一的真相来源
  mad: 0.00                        # 与参照的逐像素平均绝对差，应接近 0
  checked_at: 2026-01-01

# ── 备注 ──────────────────────────────────────────────────────
notes: |
  <踩过的坑、下次要注意什么、和哪张照片是一组>
